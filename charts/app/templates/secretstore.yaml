{{- if .Values.secrets.enabled }}
---
# The app's own store, scoped to its Infisical folder.
#
# This exists because of a real limitation in external-secrets' Infisical
# provider: `dataFrom.find.path` on an ExternalSecret is NOT passed to the API.
# The provider always fetches `secretsScope.secretsPath` from the *store*, then
# flattens the result into a map keyed by secret name alone. With one shared
# store rooted at `/` and `recursive: true`, every app pulled the whole project
# on every refresh and two folders holding the same key name collided — one app
# won the name, the other silently got nothing, and which one won could flip on
# any resync. `PAYLOAD_SECRET` in /kovo and /nsr is what surfaced it; the same
# thing was quietly happening to SPRING_DATASOURCE_USER and _PASS between
# paster-backend and music-pages-scraper-backend.
#
# Scoping the *store* to /<name> with `recursive: false` is what actually
# narrows the fetch, so the collision can no longer happen: an app only ever
# sees its own folder. Key names no longer have to be unique across apps.
#
# Cluster-scoped rather than a namespaced SecretStore so it can read the machine
# identity out of the external-secrets namespace. A namespaced store may only
# reference a Secret in its own namespace, which would mean replicating that
# credential into every app namespace to gain nothing.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ include "app.storeName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  provider:
    infisical:
      hostAPI: {{ .Values.secrets.infisical.hostAPI | quote }}
      auth:
        universalAuthCredentials:
          clientId:
            name: {{ .Values.secrets.infisical.credentialsSecret }}
            key: clientId
            namespace: {{ .Values.secrets.infisical.credentialsNamespace }}
          clientSecret:
            name: {{ .Values.secrets.infisical.credentialsSecret }}
            key: clientSecret
            namespace: {{ .Values.secrets.infisical.credentialsNamespace }}
      secretsScope:
        projectSlug: {{ .Values.secrets.infisical.projectSlug | quote }}
        environmentSlug: {{ .Values.secrets.infisical.environmentSlug | quote }}
        secretsPath: {{ include "app.secretsPath" . | quote }}
        # False on purpose. This is the whole fix — see above. A subfolder under
        # the app's own folder would reintroduce name collisions within the app.
        recursive: false
{{- end }}
