{{- if include "app.usePullSecret" . }}
{{- $host := .Values.registry.host }}
{{- $user := .Values.registry.username }}
{{- $key := .Values.registry.passwordKey }}
{{/*
The inner {{ }} below belong to external-secrets, not to Helm: the string is
built here with printf and emitted as data, so Helm never evaluates it. That is
also why %%s appears — it survives this printf and reaches ESO as %s.
*/}}
{{- $dockerconfig := printf `{"auths":{"%s":{"username":"%s","password":"{{ .%s }}","auth":"{{ printf "%%s:%%s" "%s" .%s | b64enc }}"}}}` $host $user $key $user $key }}
---
# The registry pull credential, rendered in-cluster from Infisical.
#
# It is deliberately NOT a committed dockerconfigjson: that file is base64, not
# encryption, so committing one publishes the robot's password. The only thing
# in git is the name of the Infisical key holding it.
#
# Shared, not per-app: every app pulls with the same read-only `k8s` robot, so
# this reads from a common folder rather than the app's own. It still lands as
# one Secret per namespace, because imagePullSecrets cannot cross namespaces.
#
# The one thing still on the shared `infisical` store, which is rooted at `/`
# and recursive. That store flattens the whole project by secret name, so
# `registry.passwordKey` must stay unique across every folder — if a second
# folder ever holds a key of that name, one of the two wins at random. The app's
# own secrets no longer have this constraint; they come from a scoped per-app
# store instead (see secretstore.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "app.pullSecretName" . }}
  namespace: {{ include "app.namespace" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- /*
  Deliberately NO sync-wave, same reasoning as externalsecret.yaml. Ordering it
  first does avoid a real cost — the kubelet backs off image pulls for minutes,
  so the app starts slower — but a wave that never completes means the workload
  is never created, and an empty namespace diagnoses nothing.

  ImagePullBackOff at least names the registry and the reason. Trade a slower
  first start for a failure that can be read.
  */}}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.store }}
    kind: ClusterSecretStore
  target:
    name: {{ include "app.pullSecretName" . }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ $dockerconfig | quote }}
  dataFrom:
    - find:
        path: {{ .Values.registry.secretsPath | quote }}
        name:
          regexp: {{ printf "^%s$" $key | quote }}
{{- end }}
