{{- if .Values.image }}
{{- range $k, $v := .Values.persistence }}
  {{- if and (eq ($v.accessMode | default "ReadWriteOnce") "ReadWriteOnce") (gt (int $.Values.replicas) 1) }}
    {{- fail (printf "volume %q is ReadWriteOnce and cannot be attached to %d pods — set replicas: 1, or accessMode: ReadWriteMany with a storage class that supports it" $k (int $.Values.replicas)) }}
  {{- end }}
{{- end }}
{{- $initNames := list }}
{{- range $i, $ic := .Values.initContainers }}
  {{- if not $ic.image }}
    {{- fail (printf "initContainers[%d] has no `image` — every init container needs one" $i) }}
  {{- end }}
  {{- $initNames = append $initNames (include "app.initContainerName" $ic) }}
{{- end }}
{{- if ne (len $initNames) (len (uniq $initNames)) }}
  {{- fail (printf "two init containers resolve to the same name (%s) — set an explicit `name` on one of them" (join ", " $initNames)) }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . }}
  namespace: {{ include "app.namespace" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  {{- if .Values.persistence }}
  # Not RollingUpdate: it starts the new pod before stopping the old one, and a
  # ReadWriteOnce volume cannot attach to both. The new pod would block on
  # attach — and if it ever did succeed, two processes would share one SQLite
  # file, which corrupts it.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
    spec:
      {{- if include "app.usePullSecret" . }}
      imagePullSecrets:
        - name: {{ include "app.pullSecretName" . }}
      {{- end }}
      {{- if .Values.initContainers }}
      # Each runs to completion, in the order written, before the app container
      # starts; the first one to fail stops the pod there. They inherit the same
      # envFrom, env and volume mounts as the app container, so a migration step
      # reads the same DATABASE_URL out of the same synced Secret without being
      # told about it twice.
      initContainers:
        {{- range $ic := .Values.initContainers }}
        - name: {{ include "app.initContainerName" $ic }}
          image: "{{ include "app.initImage" (dict "container" $ic "root" $) }}"
          imagePullPolicy: {{ $ic.imagePullPolicy | default $.Values.imagePullPolicy }}
          {{- with $ic.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $ic.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $.Values.secrets.enabled }}
          envFrom:
            - secretRef:
                name: {{ include "app.secretName" $ }}
          {{- end }}
          {{- $env := mustMergeOverwrite (deepCopy (default (dict) $.Values.env)) (default (dict) $ic.env) }}
          {{- with $env }}
          env:
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- with $ic.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $.Values.persistence }}
          volumeMounts:
            {{- range $key, $vol := $.Values.persistence }}
            - name: {{ $key }}
              mountPath: {{ required (printf "persistence.%s.mountPath is required" $key) $vol.mountPath }}
              {{- with $vol.subPath }}
              subPath: {{ . }}
              {{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ include "app.name" . }}
          image: "{{ include "app.imageRepository" . }}:{{ .Values.imageTag | default "latest" }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          {{- if .Values.secrets.enabled }}
          envFrom:
            # Every key in the app's Infisical folder, as env vars. Adding a
            # secret upstream needs no change here.
            - secretRef:
                name: {{ include "app.secretName" . }}
          {{- end }}
          {{- with .Values.env }}
          env:
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.healthPath }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.persistence }}
          volumeMounts:
            {{- range $key, $vol := .Values.persistence }}
            - name: {{ $key }}
              mountPath: {{ required (printf "persistence.%s.mountPath is required" $key) $vol.mountPath }}
              {{- with $vol.subPath }}
              subPath: {{ . }}
              {{- end }}
            {{- end }}
          {{- end }}
      {{- if .Values.persistence }}
      volumes:
        {{- range $key, $vol := .Values.persistence }}
        - name: {{ $key }}
          persistentVolumeClaim:
            claimName: {{ include "app.name" $ }}-{{ $key }}
        {{- end }}
      {{- end }}
{{- end }}