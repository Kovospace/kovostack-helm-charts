{{- if .Values.secrets.enabled }}
---
# Syncs every secret in the app's Infisical folder into one Secret, keyed by the
# Infisical key names. Apps consume it with envFrom, so adding a secret in
# Infisical needs no change here — that is the point of the convention.
#
# "The app's folder" is enforced by the store this points at, not by anything in
# this file. See secretstore.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "app.name" . }}
  namespace: {{ include "app.namespace" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- /*
  Deliberately NO sync-wave. Ordering this before the Deployment is correct in
  principle — envFrom on a missing Secret blocks pod start — but the failure
  mode is far worse than the problem it avoids.

  An ExternalSecret that cannot sync never reports Healthy, so ArgoCD never
  advances past its wave and the Deployment, Service and Ingress are never
  submitted at all. The symptom is an empty namespace, which says nothing about
  the cause. Every secret misconfiguration became an archaeology exercise.

  Without the wave the pod is created and sits in CreateContainerConfigError,
  which names the missing Secret in `kubectl describe pod`. It recovers on its
  own once the secret syncs.
  */}}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: {{ include "app.storeName" . }}
    kind: ClusterSecretStore
  target:
    name: {{ include "app.secretName" . }}
    # Owner: the Secret is deleted with the ExternalSecret, so a removed app
    # leaves no credentials behind in the cluster.
    creationPolicy: Owner
  {{- /*
  No `path` here on purpose. It reads like the thing that scopes this to the
  app's folder, but the Infisical provider never sends it to the API — it
  fetches whatever the *store* is scoped to and filters afterwards. Setting it
  here bought nothing and hid where the real scoping lives; the store rendered
  by secretstore.yaml is now narrowed to /<name> instead.
  */}}
  dataFrom:
    - find:
        name:
          regexp: ".*"
{{- end }}