{{- if .Values.host }}
{{- /* `host` is a string or a list of strings; normalise to a list. */}}
{{- $given := list }}
{{- if kindIs "string" .Values.host }}
{{- $given = list .Values.host }}
{{- else if kindIs "slice" .Values.host }}
{{- $given = .Values.host }}
{{- else }}
{{- fail (printf "host must be a string or a list of strings, got %s" (kindOf .Values.host)) }}
{{- end }}
{{- $hosts := list }}
{{- range $given }}
{{- if not (kindIs "string" .) }}
{{- fail (printf "host list entries must be strings, got %s (%v)" (kindOf .) .) }}
{{- end }}
{{- if not . }}
{{- fail "host list contains an empty entry" }}
{{- end }}
{{- $hosts = append $hosts . }}
{{- if $.Values.wwwAlias }}
{{- if hasPrefix "www." . }}
{{- fail (printf "host %q already starts with www. — wwwAlias would ask for www.%s" . .) }}
{{- end }}
{{- $hosts = append $hosts (printf "www.%s" .) }}
{{- end }}
{{- end }}
{{- if ne (len $hosts) (len (uniq $hosts)) }}
{{- fail (printf "host lists a name more than once after wwwAlias expansion: %s" (join ", " $hosts)) }}
{{- end }}
---
# cert-manager's ingress-shim turns this annotation plus the tls block into a
# Certificate — no Certificate resource is written by hand anywhere in this repo.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.name" . }}
  namespace: {{ include "app.namespace" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.clusterIssuer }}
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  tls:
    # One certificate covering every name below. A SAN whose DNS record is
    # missing fails the HTTP-01 challenge and takes the *whole* certificate
    # with it — the apex included — so point www at the cluster before turning
    # wwwAlias on, not after.
    {{- /* The same goes for every domain listed in `host`: each one needs a DNS
    record pointing at the cluster before it is added to the list. Kept as a
    template comment so single-host renders stay byte-identical. */}}
    - hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ include "app.tlsSecretName" . }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "app.name" $ }}
                port:
                  number: {{ $.Values.servicePort }}
    {{- end }}
{{- end }}