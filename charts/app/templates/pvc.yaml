{{- range $key, $vol := .Values.persistence }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "app.name" $ }}-{{ $key }}
  namespace: {{ include "app.namespace" $ }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
  annotations:
    # Deliberately NO sync-wave. An earlier wave deadlocks: ArgoCD waits for the
    # PVC to report Healthy before starting the next wave, but a
    # WaitForFirstConsumer volume stays Pending until a pod consumes it — and
    # that pod is in the later wave. Each side waits for the other, forever.
    #
    # No ordering is needed anyway: a pod referencing a PVC that does not exist
    # yet stays Pending until it does, which is the same result without the
    # deadlock.
    #
    # NOT Prune=false. That kept the claim, but ArgoCD then reported the app
    # OutOfSync forever over a resource it had been told never to remove, which
    # blocked every later sync — it protected the data by breaking the delivery
    # of everything else.
    #
    # Delete=false is narrower: it only stops the claim being swept up when the
    # Application itself is deleted. Normal pruning still works, so removing a
    # volume from values.yaml removes the claim and the app stays Synced.
    argocd.argoproj.io/sync-options: Delete=false
    {{- if $.Values.backup.enabled }}
    {{- /*
    Stated either way rather than left to K8up's default, so the answer does not
    depend on how the operator is configured: with BACKUP_SKIP_WITHOUT_ANNOTATION
    an unannotated claim is silently skipped, without it it is silently included.
    */}}
    {{- if include "app.backupVolume" (dict "root" $ "vol" $vol) }}
    k8up.io/backup: "true"
    {{- $pvc := printf "%s-%s" (include "app.name" $) $key }}
    {{- $excludes := list }}
    {{- range $f := (include "app.sqliteFiles" $ | fromJson).files }}
    {{- if eq $f.key $key }}
    {{- range $suffix := list "" "-wal" "-shm" "-journal" }}
    {{- $excludes = concat $excludes (list "--exclude" (printf "/data/%s/%s%s" $pvc $f.rel $suffix)) }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- with $excludes }}
    # The live SQLite files are left out of the file-level copy: a copy taken
    # mid-write restores corrupt, and a stale -wal next to a restored database
    # is replayed into it. The consistent snapshot comes from the sqlite
    # PreBackupPod instead — see backup.yaml.
    k8up.io/backup-restic-args: {{ toJson . | squote }}
    {{- end }}
    {{- else }}
    k8up.io/backup: "false"
    {{- end }}
    {{- end }}
spec:
  accessModes:
    - {{ $vol.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ required (printf "persistence.%s.size is required" $key) $vol.size }}
  {{- /* `default` would treat an explicit "" as unset, making it impossible to
         opt back out to the cluster default. hasKey distinguishes the two. */}}
  {{- $sc := $.Values.storageClass }}
  {{- if hasKey $vol "storageClass" }}{{ $sc = $vol.storageClass }}{{ end }}
  {{- with $sc }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}