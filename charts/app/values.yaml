---
# The only required value. Everything else is derived from it:
#
#   namespace              <name>
#   Infisical folder       /<name>
#   generated Secret       <name>-secrets
#   TLS Secret             <name>-tls
#
# Override the derived values below only where an app genuinely differs.
name: ""

# --- workload ---------------------------------------------------------------
# Leave `image` empty and no Deployment or Service is rendered — the chart then
# provides only the namespace, secrets and ingress for an app whose workload
# comes from its own chart.
#
# A bare name is one of ours: everything this platform builds is pushed under
# `apps/` in zot, so `image: nsr` becomes registry.matejkovac.sk/apps/nsr.
# Anything with a slash is taken as written — traefik/whoami, ghcr.io/owner/x,
# or the spelled-out registry.matejkovac.sk/apps/nsr.
image: ""
imageTag: ""
imagePullPolicy: IfNotPresent
replicas: 1
containerPort: 8080

# Plain env vars. Anything sensitive belongs in Infisical, not here — it is
# injected wholesale from the synced Secret via envFrom.
env: {}

resources: {}
#  requests: {cpu: 50m, memory: 64Mi}
#  limits:   {memory: 256Mi}

# Probed on containerPort when set. Empty disables the probe rather than
# defaulting to "/", which would mark apps healthy that merely 404.
healthPath: ""

# Separate paths for the two probes, each falling back to healthPath. They
# answer different questions, and one path for both is what turns a database
# blip into every replica restarting at once:
#   readiness - "send me traffic?"  A failure takes the pod out of the Service.
#   liveness  - "am I stuck?"       A failure restarts the container, so it must
#                                   not depend on anything a restart cannot fix.
# Spring Boot: /actuator/health/readiness and /actuator/health/liveness.
readinessPath: ""
livenessPath: ""

# --- init containers ---------------------------------------------------------
# Steps that must finish before the app container starts — a database
# migration, a seed, waiting on a dependency. Kubernetes runs them one at a
# time, in order, and the first failure stops the pod there.
#
# A *list*, not a map like `persistence` and `externalServices`: Helm iterates
# map keys in sorted order, so a map would silently reorder your steps. The
# order you write is the order they run.
#
#   initContainers:
#     - image: nsr-migrate            # expanded like `image` above
#       command: ["./manage.py", "migrate"]
#     - image: nsr-seed
#
# Each entry inherits, without repeating any of it:
#
#   envFrom   the app's synced Secret — every key in its Infisical folder
#   env       everything in `env:` above, overridable per entry
#   volumes   the same `persistence:` mounts, at the same paths
#
# so a migration reads the same DATABASE_URL as the app by construction. That
# is the answer to "where do the parameters come from": the same two places the
# app container gets them, and nothing has to be wired twice.
#
# Per entry — only `image` is required:
#
#   image            required; bare name = ours, slash = taken as written
#   imageTag         defaults below
#   name             defaults to init-<last path segment of image>
#   command, args    override the image's entrypoint
#   env              extra vars for this step; wins over the shared `env:`
#   resources        as on the app container
#   imagePullPolicy  defaults to `imagePullPolicy` above
#
# Tags: an entry with no `imageTag` that resolves to *our* registry rides the
# app's `imageTag`, because a migrate image is built by the same pipeline and
# carries the same version — one bump in versions/<app>.yaml moves both.
#
# An image from anywhere else has no such relationship and falls back to
# `latest`, so pin those explicitly. Mind the slash rule while you do: a bare
# `busybox` is read as *ours* and becomes <registry>/apps/busybox. To reach the
# public one, spell it out — `docker.io/library/busybox`, with its own imageTag.
#
# Overriding from a second values file replaces this list wholesale — Helm
# never merges lists element by element. Keep the whole list in one file.
initContainers: []

# Tags for init container images that are released on their own cadence, keyed
# by the container's name — the entry's `name`, or the derived `init-<image>`
# when it has none:
#
#   initContainers:
#     - name: migrations
#       image: new-tab-links-migrations
#
#   initImageTags:
#     migrations: "1.2.3"
#
# The point of the map is that a *list* cannot be patched from a second values
# file and a map can. So this tag can live in its own file under versions/,
# written by that image's pipeline, while the list above stays where humans edit
# it. It is a different key from `imageTag`, so the two version files merge
# instead of the later one overwriting the app's tag.
#
# Reach for it when a step's image has its own version that is not the app's — a
# migrations repository publishing a schema version. A migrate image built by
# the app's own pipeline needs nothing here: it already rides `imageTag`.
#
# Setting a tag here *and* an `imageTag` on the same entry is refused rather
# than resolved. Quote the value — an unquoted 1.2 is a YAML float, not a tag.
initImageTags: {}

# --- services outside the cluster --------------------------------------------
# Things running on the VM but not in Kubernetes — Postgres, Redis, anything in
# the platform's Docker stack. Each entry becomes a selector-less Service plus a
# matching EndpointSlice, so the app reaches it by name:
#
#   externalServices:
#     postgres:
#       address: 172.17.0.1     # must be an IP, not a hostname
#       port: 5432
#
#   -> the app connects to postgres:5432
#
# `address` has to be one the pods can actually reach. The host's 127.0.0.1 is
# not it — inside a pod that is the pod's own loopback. Bind the container to a
# host address instead (POSTGRES_BIND in the platform .env) and use that.
# Prefer a private one such as the docker0 gateway over the VM's public IP: a
# database on a public address is protected only by a firewall rule.
externalServices: {}

# --- storage ----------------------------------------------------------------
# Each entry becomes a PersistentVolumeClaim named <name>-<key>, mounted into
# the container at mountPath. Keys are yours to choose.
#
#   persistence:
#     data:
#       size: 1Gi
#       mountPath: /app/data
#     uploads:
#       size: 10Gi
#       mountPath: /app/uploads
#
# Per entry: size and mountPath are required; storageClass, accessMode (default
# ReadWriteOnce) and subPath are optional. `backup: false` leaves the volume out
# of `backup:` below — scratch space, caches, anything re-derivable.
#
# Class for app volumes. local-path-retain keeps the data on disk when a PVC is
# deleted, unlike k3s' stock local-path which deletes it with the claim. Set to
# "" per entry for the cluster default, for data that is genuinely disposable.
storageClass: local-path-retain
#
# ReadWriteOnce volumes cannot be attached to two pods at once, so the chart
# switches the Deployment to the Recreate strategy and refuses replicas > 1 as
# soon as any volume exists. That is deliberate: a rolling update would
# otherwise briefly run two pods against one SQLite file and corrupt it.
persistence: {}

# --- ingress ----------------------------------------------------------------
# Leave `host` empty for an app with no public route (worker, cron, internal).
host: ""

# Serve www.<host> as well, on the same certificate. For an apex domain
# (kovo.space) that is what visitors type; for a subdomain
# (nsr.matejkovac.sk) www.nsr.matejkovac.sk is meaningless, which is why this
# is off by default.
#
# `www.<host>` needs its own DNS record pointing at the cluster *before* this
# is enabled. Without one the HTTP-01 challenge for that name fails, and
# because both names share a certificate the failure takes the apex down with
# it — an already-serving site loses TLS. Let's Encrypt also rate-limits
# failures at 5/hour per domain, so validate against clusterIssuer
# letsencrypt-staging first.
wwwAlias: false
ingressClassName: traefik
clusterIssuer: letsencrypt-production
servicePort: 80

# --- private registry -------------------------------------------------------
# Pulling from the platform's zot needs credentials — anonymous access is denied
# there. The password never enters git: it is read from Infisical and rendered
# into a dockerconfigjson Secret in the app's namespace.
registry:
  # Where a bare `image` is resolved against, as <host>/apps/<image>. An image
  # that ends up on this host gets a pull secret automatically; public ones
  # (traefik/whoami, ghcr.io/...) do not. Must match REGISTRY_HOST in the
  # platform repo's .env.
  host: registry.matejkovac.sk

  # The read-only robot from zot's accessControl: it can pull apps/** and
  # charts/**, and cannot push anything.
  username: k8s

  # Where that robot's password lives in Infisical. Shared by every app, so it
  # is deliberately not the app's own folder.
  secretsPath: /platform
  passwordKey: ZOT_K8S_PASSWORD

  # Empty = decide from `image`. Set true for an app whose workload lives in its
  # own chart, where `image` is empty here and there is nothing to detect.
  pullSecret: ""

# --- secrets ----------------------------------------------------------------
secrets:
  enabled: true

  # The *shared* cluster store, used only for the registry credential in
  # /platform (see registry.secretsPath). The app's own secrets come from a
  # per-app store this chart renders instead — see templates/secretstore.yaml.
  store: infisical

  refreshInterval: 1h

  # Infisical folder to sync. Defaults to /<name> — the convention. Set this
  # only when an app must read a folder that is not named after it.
  #
  # This scopes the per-app store, which is the only thing the Infisical
  # provider actually honours; it is not a filter on the ExternalSecret.
  path: ""

  # Connection settings for the per-app ClusterSecretStore.
  #
  # These must match the `infisical.*` block in the gitops repo's
  # infrastructure/external-secrets/values.yaml — same Infisical, same project,
  # same environment, same machine identity. They are duplicated here because a
  # store has to be rendered per app to scope it, and the chart cannot read the
  # infrastructure chart's values. Change one, change the other.
  infisical:
    hostAPI: https://secrets.matejkovac.sk
    projectSlug: kovostack
    environmentSlug: prod
    # NAME and namespace of the Kubernetes Secret holding the machine identity,
    # not the credential itself. Created by hand at bootstrap.
    credentialsSecret: infisical-credentials
    credentialsNamespace: external-secrets
# --- backup -----------------------------------------------------------------
# Off by default. Switched on, it renders K8up (k8up.io/v1) objects that back up,
# every night, to each destination below:
#
#   volumes    every `persistence` entry, file by file (opt one out with
#              `persistence.<key>.backup: false`)
#   sqlite     a consistent snapshot of each file in `sqlite.files`
#   postgres   a pg_dump of the app's database, over `externalServices`
#
# Any combination works: volumes only, volumes + sqlite, volumes + postgres, or
# postgres alone for an app with no volumes. Rendering fails if backup is on
# and there is nothing to back up. Needs the K8up operator and its CRDs in the
# cluster. See the README for restoring.
backup:
  enabled: false

  # Where snapshots go. A *map*, so a second destination is one more entry in a
  # values file rather than a restatement of the first — maps merge across
  # values files, lists do not. Each enabled entry gets its own Schedule, its
  # own credentials Secret and its own dump pods, so destinations never share a
  # run.
  #
  # The repository for this app is <url>/<name>/ — one restic repository per
  # app, so a dev instance (new-tab-links-backend-dev) never mixes with prod.
  #
  # Credentials come through `store`, a ClusterSecretStore owned by the infra
  # repo and scoped to the backup folder alone (Infisical /backup for the
  # gateway). This chart only references it by name — rendering it here would
  # give one cluster-scoped object as many owners as there are apps. Keys:
  #   usernameKey/passwordKey   the REST server's HTTP basic auth
  #   repoPasswordKey           restic's repository encryption password
  # K8up splices the basic-auth pair into the repository URL unescaped, so the
  # REST username and password must be alphanumeric.
  #
  # statsURL (optional, empty = none) is passed to the Schedule; K8up POSTs
  # backup stats to it.
  #
  # Adding the home Raspberry Pi later is one entry, e.g.:
  #   destinations:
  #     pi:
  #       url: http://192.168.1.20:8000
  #       store: infisical-backup-pi
  #
  # Per destination, `schedule` may override the one below key by key, and
  # `retention` replaces it as a whole. `enabled: false` switches one off
  # without deleting it. usernameKey, passwordKey and repoPasswordKey default
  # to the names shown, so a new destination needs only url and store.
  destinations:
    gateway:
      url: http://restic-gateway.backup.svc.cluster.local:8080
      store: infisical-backup
      usernameKey: RESTIC_REST_USERNAME
      passwordKey: RESTIC_REST_PASSWORD
      repoPasswordKey: RESTIC_PASSWORD
      statsURL: ""

  # Cron expressions, read in the K8up operator's time zone (Europe/Bratislava
  # on this cluster). Empty = a slot derived from the app and destination name:
  # backup nightly at 00:xx, 01:xx, 03:xx or 04:xx, check on Wednesdays and
  # prune on Sundays four hours later. So apps spread out over the night instead
  # of all hitting the gateway at once, and a prune does not collide with the
  # backup it is pruning. 02:xx is avoided: on DST change days it runs twice or
  # not at all — keep overrides out of it too. K8up's own @daily-random etc. are
  # accepted, but spread over all 24 hours.
  # Overriding only `backup` leaves check and prune on their derived slots, so
  # move those too if the new backup time comes near them.
  schedule:
    backup: ""
    check: ""
    prune: ""

  # restic forget --keep-*. Any of keepLast, keepHourly, keepDaily, keepWeekly,
  # keepMonthly, keepYearly, keepTags. Replaced as a whole per destination.
  retention:
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 6

  # Default statsURL for destinations that set none.
  statsURL: ""

  # Finished K8up jobs to keep around for `kubectl logs`, per job type.
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3

  # A live SQLite file cannot be copied safely: a copy taken mid-write restores
  # as a corrupt database, silently. List each database here — the path the app
  # sees, the same one as in its DATABASE_URI — and a dump pod snapshots it with
  # `VACUUM INTO` (one consistent read transaction, safe while the app writes),
  # integrity-checks the copy, and streams it into the snapshot as
  # /<name>-sqlite.tar. The live files (and
  # their -wal/-shm/-journal) are left out of the file-level volume backup.
  #
  #   sqlite:
  #     files:
  #       - /app/data/nsr.db
  #
  # Each file must sit under a `persistence` mountPath. The dump pod mounts that
  # volume at the same path, alongside the running app — SQLite's own locking
  # makes that safe on a node-local volume.
  sqlite:
    files: []
    # Anything with sqlite3, sh and tar. Taken as written, not expanded like
    # `image`.
    image: docker.io/keinos/sqlite3
    imageTag: "3.53.4"
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits:   {memory: 256Mi}

  # pg_dump of the app's database, for Postgres outside the cluster. The dump
  # pod gets the app's own environment — its synced Secret via envFrom and
  # everything in `env:` — so it connects exactly as the app does, through the
  # same `externalServices` name. You say which of those variables hold what:
  #
  #   urlEnv       a URL: postgres://, postgresql:// or jdbc:postgresql://
  #                (jdbc: and its ?query are stripped; credentials in a
  #                postgres:// URL are used as they are)
  #   hostEnv, portEnv, databaseEnv, userEnv, passwordEnv
  #                the parts, each overriding what the URL does not carry
  #   env          literal PG* variables, for what the app has nowhere, e.g.
  #                {PGDATABASE: scraper}
  #
  #   Spring:   urlEnv: SPRING_DATASOURCE_URL
  #             userEnv: SPRING_DATASOURCE_USERNAME
  #             passwordEnv: SPRING_DATASOURCE_PASSWORD
  #   Payload:  urlEnv: DATABASE_URI
  #
  # A variable that is named here but empty in the pod fails the backup rather
  # than dumping with a default.
  postgres:
    enabled: false
    urlEnv: ""
    hostEnv: ""
    portEnv: ""
    databaseEnv: ""
    userEnv: ""
    passwordEnv: ""
    env: {}
    # plain -> /<name>-postgres.sql, restored with psql; deduplicates well.
    # custom -> /<name>-postgres.dump, restored with pg_restore (selective).
    format: plain
    extraArgs: []
    # The client's major version must be at least the server's: pg_dump
    # refuses a newer server. The platform's Postgres is 17, and a matching
    # major is the safe choice, since a newer pg_dump's output is only
    # guaranteed to load into a server at least as new as itself.
    image: docker.io/library/postgres
    imageTag: "17.11-alpine"
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits:   {memory: 512Mi}
